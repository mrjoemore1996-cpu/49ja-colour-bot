name: Build 49JA Android App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q 49ja-colour-bot-source.zip -d project
          sed -i 's/2.0.21/1.9.25/g' project/build.gradle.kts

      - name: Install Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: 49JA-Colour-Bot
          path: project/app/build/outputs/apk/debug/app-debug.apk
